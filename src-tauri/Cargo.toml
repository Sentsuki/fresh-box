[package]
name = "fresh-box"
version = "1.14.0"
description = "fresh-box"
authors = ["sentsuki"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fresh_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tauri-build = { version = "2", features = [] }
tonic-prost-build = "0.14.6"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
urlencoding = "2"
zip = "8"
window-vibrancy = "0.7"
tauri-plugin-notification = "2"
rand = "0.10"
sha2 = "0.11"
indexmap = { version = "2.14.0", features = ["serde"] }
# gRPC client for sing-box-daemon.exe (boxdd). No server feature needed —
# fresh-box only ever dials out to the daemon/worker pipe.
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tonic-prost = "0.14.6"
base64 = "0.23.1"
tauri-plugin-autostart = "2"
# App self-update: checks a signed `latest.json` manifest published
# alongside GitHub releases, downloads + verifies (Ed25519 signature, not
# just an Authenticode check) + runs the installer, all built into the
# plugin rather than hand-rolled here — see `tauri.conf.json`'s
# `plugins.updater` (endpoint + public key) for the other half. Artifacts
# are signed automatically at `tauri build` time (`bundle.createUpdaterArtifacts`)
# when `TAURI_SIGNING_PRIVATE_KEY`/`TAURI_SIGNING_PRIVATE_KEY_PASSWORD` are
# set in the build environment — see docs/updater-releasing.md. No
# `tauri-plugin-process` needed alongside it: on Windows the updater's own
# `install()` already launches the new installer and calls
# `std::process::exit(0)` itself (with `restartAfterInstall` defaulting to
# `true`, so the installer relaunches fresh-box once it finishes) — nothing
# on the frontend needs to trigger a relaunch separately.
tauri-plugin-updater = "2"
# Structured, leveled application logging — replaces the scattered
# println!/eprintln! calls that used to be this app's only logging, none of
# which had a level, went to a file, or rotated. See `logger::init_tracing`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Used to open files/URLs via `ShellExecuteW` directly instead of shelling
# out to `cmd /C start` (see `commands::config::open_with_system`) — avoids
# handing untrusted strings to cmd.exe's own command-line parser. The
# `Win32_System_JobObjects`/`Win32_Security`/`Win32_System_Threading` trio is
# for `daemon::worker`'s kill-on-close job object, which ties the daemon
# worker relay process's lifetime to this process's — see the doc comment on
# `spawn_kill_on_drop_job` there.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
] }
